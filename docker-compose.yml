name: gophkeeper

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gophkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-gophkeeper}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data

  server:
    container_name: gophkeeper-server
    build:
      context: .
      dockerfile: build/server/Dockerfile
    ports:
      - "${GOPHKEEPER_GRPC_PUBLISH:-50051}:50051"
    environment:
      GOPHKEEPER_GRPC_ADDR: ${GOPHKEEPER_GRPC_ADDR:-0.0.0.0:50051}
      GOPHKEEPER_LOG_LEVEL: ${GOPHKEEPER_LOG_LEVEL:-info}
      GOPHKEEPER_DATABASE_URL: postgres://${POSTGRES_USER:-gophkeeper}:${POSTGRES_PASSWORD:-gophkeeper}@postgres:5432/${POSTGRES_DB:-gophkeeper}?sslmode=disable
      GOPHKEEPER_MINIO_ENDPOINT: minio:9000
      GOPHKEEPER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      GOPHKEEPER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GOPHKEEPER_MINIO_BUCKET: ${GOPHKEEPER_MINIO_BUCKET:-gophkeeper}
      GOPHKEEPER_MINIO_USE_SSL: ${GOPHKEEPER_MINIO_USE_SSL:-false}
      GOPHKEEPER_JWT_SECRET: ${GOPHKEEPER_JWT_SECRET:-gophkeeper-local-dev-jwt-secret-replace-in-production}
      GOPHKEEPER_ACCESS_TOKEN_TTL_SECONDS: ${GOPHKEEPER_ACCESS_TOKEN_TTL_SECONDS:-900}
      GOPHKEEPER_REFRESH_TOKEN_TTL_SECONDS: ${GOPHKEEPER_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      GOPHKEEPER_GRPC_TLS_CERT_PATH: ${GOPHKEEPER_GRPC_TLS_CERT_PATH:-/certs/server.crt}
      GOPHKEEPER_GRPC_TLS_KEY_PATH: ${GOPHKEEPER_GRPC_TLS_KEY_PATH:-/certs/server.key}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
